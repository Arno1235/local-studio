# Optional OLD PC helper. The NEW VM lab stack does not run Postgres.
# Controller and llama.cpp run natively on the GPU host, not in Docker.

services:
  postgres:
    image: postgres:16
    container_name: local-studio-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-local_studio}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
