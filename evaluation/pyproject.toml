[project]
name = "llm-lab-eval"
version = "1.0.0"
description = "Zero-cost local LLM evaluation against an OpenAI-compatible endpoint"
requires-python = ">=3.10"
dependencies = [
  "mlflow==3.15.1",
  "pyyaml==6.0.2",
]

[project.scripts]
llm-lab-eval = "llm_lab_eval.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_lab_eval*"]
