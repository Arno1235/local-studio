name: llm-lab

services:
  local-studio-frontend:
    build:
      context: .
      dockerfile: new-vm/docker/frontend/Dockerfile
    image: local-studio-frontend:lab
    container_name: local-studio-frontend
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "4783"
      NODE_ENV: production
      BACKEND_URL: ${OLD_PC_LOCAL_STUDIO_URL}
      API_KEY: ${OLD_PC_LOCAL_STUDIO_API_KEY}
      LOCAL_STUDIO_API_KEY: ${OLD_PC_LOCAL_STUDIO_API_KEY}
      ALLOWED_LAN_HOSTS: "true"
      ALLOWED_TAILSCALE_HOSTS: ${NEW_VM_PUBLIC_HOST:-192.168.0.230}
      LOCAL_STUDIO_DATA_DIR: /var/lib/local-studio
      LOCAL_STUDIO_AGENT_RUNTIME_PORT: "4784"
      LOCAL_STUDIO_AGENT_RUNTIME_URL: http://127.0.0.1:4784
      LOCAL_STUDIO_FRONTEND_BASE: http://127.0.0.1:4783
    ports:
      - "${FRONTEND_PORT:-4783}:4783"
    volumes:
      - ./data/frontend:/var/lib/local-studio
    restart: unless-stopped
    extra_hosts:
      - "old-pc:${OLD_PC_HOST:-192.168.0.69}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4783/"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s

  mlflow:
    build:
      context: .
      dockerfile: new-vm/docker/mlflow/Dockerfile
    image: llm-lab-mlflow:3.15.1
    container_name: mlflow
    environment:
      MLFLOW_HOST: "0.0.0.0"
      MLFLOW_PORT: "5000"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./data/mlflow:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
